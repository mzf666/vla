<script>
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_() {
  const err = document.getElementById('err');
  err.textContent = 'Decrypting...';
  const p = JSON.parse(atob(document.getElementById('payload').textContent));
  const base = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(document.getElementById('pw').value),
    'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name: 'PBKDF2', salt: b64(p.salt), iterations: p.iterations, hash: 'SHA-256'},
    base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  try {
    const out = await crypto.subtle.decrypt(
      {name: 'AES-GCM', iv: b64(p.nonce)}, key, b64(p.ct));
    document.getElementById('doc').innerHTML =
      new TextDecoder('utf-8').decode(out);
    document.getElementById('gate').remove();
  } catch (e) {
    err.textContent = 'Wrong password.';
  }
}
document.getElementById('go').onclick = open_;
document.getElementById('pw').addEventListener(
  'keydown', e => { if (e.key === 'Enter') open_(); });
</script>
